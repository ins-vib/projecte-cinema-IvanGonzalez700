<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>


    <form th:action="@{/cinemes/create}" method="post" th:object="${cinema}">

        <label>Nom:</label>
        <input type="text" th:field="*{name}">
        <br>

        <label>Adreça:</label>
        <input type="text" th:field="*{address}">
        <br>

        <label>City:</label>
        <input type="text" th:field="*{city}">
        <br>

        <label>Codi:</label>
        <input type="text" th:field="*{postalCode}">
        <br>

        <button type="submit">Agregar cinema</button>

    </form>
</body>

</html>
