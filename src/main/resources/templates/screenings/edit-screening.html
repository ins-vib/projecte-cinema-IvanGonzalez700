<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Projecció</title>
</head>

<body>
    <h1>Editar projecció per <span th:text="${movie.title}"></span></h1>

    <form th:action="@{/screenings/{id}/screenings/edit(id=${movie.id})}" th:object="${screening}" method="post">
        <input type="hidden" th:field="*{id}" />

        <label>Data i hora:</label>
        <input type="datetime-local" th:field="*{screeningDateTime}" /><br/>

        <label>Preu:</label>
        <input type="number" step="0.01" th:field="*{price}" /><br/>

        <label>Sala:</label>
        <select th:field="*{room}">
            <option th:each="room : ${rooms}" th:value="${room.id}" th:text="${room.name}"></option>
        </select><br/>

        <button type="submit">Guardar</button>
    </form>

    <a th:href="@{/screenings/{id}/screenings(id=${movie.id})}">Tornar a projeccions</a>
</body>

</html>
