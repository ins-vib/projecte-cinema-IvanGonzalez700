<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <h1>Nom del cinema:</h1>
    <h2 th:text="${cinema.name}">Nom</h2>

    <h1>Adreça:</h1>
    <h2 th:text="${cinema.Address}">Adreça</h2>

    <h1>Codi postal:</h1>
    <h2 th:text="${cinema.PostalCode}">Codi Postal</h2>

    <h1>ID del cinema:</h1>
    <h2 th:text="${cinema.id}">ID</h2>

    <h1>Ciutat:</h1>
    <h2 th:text="${cinema.city}">Ciutat</h2>

    <h2>sales</h2>


    <table>
        <thead>
            <tr>
                <th>Nom</th>
                <th>Ciutat</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="room : ${cinema.rooms}">
                <td th:text="${room.name}">Nom</td>

                <td>
                    <a th:href="@{/rooms/{id}(id=${room.id})}">Veure detalls</a>
                </td>

                <td>
                    <a th:href="@{/rooms/{id}/delete(id=${room.id})}">Eliminar sala</a>
                </td>

                <td>
                    <a th:href="@{/rooms/{id}/edit(id=${room.id})}">Editar sala</a>
                </td>

                <td>
                    <a th:href="@{/room/{id}(id=${room.id})}">Seients</a>
                </td>

            </tr>

        </tbody>
    </table>

    <div th:if="${#lists.isEmpty(cinema.rooms)}">No hi ha sales en aquest cinema</div>

    <a th:href="@{/rooms/create/{id}(id=${cinema.id})}">Crear nova sala</a>
</body>

</html>
