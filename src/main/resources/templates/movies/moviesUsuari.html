<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pel·lícules</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <style>
        .genre-badge {
            display: inline-block;
            background-color: #dbeafe;
            color: #1e40af;
            border: 1px solid #bfdbfe;
            border-radius: 12px;
            padding: 2px 10px;
            font-size: 0.8em;
            font-weight: 600;
            margin: 2px 2px;
            white-space: nowrap;
        }
        .genres-cell {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            align-items: center;
        }
    </style>
</head>

<body>

    <main>
        <h1>Pel·lícules disponibles</h1>
        
        <table border="1" cellpadding="10" cellspacing="0">
            <thead>
                <tr>
                    <th>Títol</th>
                    <th>Sinopsis</th>
                    <th>Duració</th>
                    <th>Gèneres</th>
                    <th>Veure sessions</th>
                    <th>Veure ressenyes</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="movie : ${movies}">
                    <td th:text="${movie.title}">Título de película</td>
                    <td th:text="${movie.description}">Descripción</td>
                    <td th:text="${movie.duration} + ' min'">Duración</td>
                    <td>
                        <!-- Mostra els gèneres classificats com a badges -->
                        <div class="genres-cell">
                            <th:block th:if="${movie.genres != null and !movie.genres.isEmpty()}">
                                <span class="genre-badge"
                                      th:each="genre : ${movie.genres}"
                                      th:text="${genre.name}">Gènere</span>
                            </th:block>
                            <span th:if="${movie.genres == null or movie.genres.isEmpty()}"
                                  style="color:#aaa; font-style:italic; font-size:0.85em;">
                                Sense classificació
                            </span>
                        </div>
                    </td>
                    <td>
                        <a th:href="@{/sessions/{id}/sessions(id=${movie.id})}">Veure sessions</a>
                    </td>
                    <td>
                        <a th:href="@{/movies/{id}/reviews(id=${movie.id})}">Veure valoracions</a>
                    </td>
                </tr>
            </tbody>
        </table>
        
        <br>
        <p><a th:href="@{/}">Inici</a></p>
    </main>

</body>

</html>
